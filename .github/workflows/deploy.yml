name: Continuous Deployment to Cloud Run (v2.2 Hardened Causal Engine)

on:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# One-time setup required before this workflow can deploy successfully:
#   gh secret set API_KEY --body "$(openssl rand -hex 32)"
#   gh secret set PUBLIC_API_KEY --body "$(openssl rand -hex 32)"
# (GCP_SA_KEY is assumed already configured from the prior deploy pipeline.)
# These are mapped via `--set-secrets` against Secret Manager instead of env_vars,
# so the value never appears in `gcloud run services describe` output.
env:
  GCP_PROJECT_ID: gtm-m4299zzd-nti4m
  GCP_REGION: europe-west1
  ARTIFACT_REGISTRY_REPO: intent-engine-repo
  SERVICE_NAME: causal-ecommerce-uplift-engine

jobs:
  test:
    runs-on: ubuntu-latest
    # Dummy, non-production values — only need to satisfy the dev-mode config
    # path (ENVIRONMENT=development) so the suite can authenticate its own
    # requests. Never reused for the actual deploy below.
    env:
      ENVIRONMENT: development
      API_KEY: ci-test-key-not-for-prod
      PUBLIC_API_KEY: ci-test-public-key-not-for-prod
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Run test suite
        run: pytest -v

  deploy-to-cloud-run:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Validate required secrets are configured
        env:
          API_KEY: ${{ secrets.API_KEY }}
          PUBLIC_API_KEY: ${{ secrets.PUBLIC_API_KEY }}
        run: |
          missing=""
          [ -z "$API_KEY" ] && missing="${missing}API_KEY "
          [ -z "$PUBLIC_API_KEY" ] && missing="${missing}PUBLIC_API_KEY "
          if [ -n "$missing" ]; then
            echo "::error::Missing GitHub secret(s): $missing— set with:"
            echo "::error::  gh secret set API_KEY --body \"\$(openssl rand -hex 32)\""
            echo "::error::  gh secret set PUBLIC_API_KEY --body \"\$(openssl rand -hex 32)\""
            echo "::error::Deploying with these unset causes the container to crash-loop on boot (config/settings.py fails closed in production), which otherwise surfaces as a confusing 'container failed to start and listen on the port' Cloud Run error."
            exit 1
          fi

      - name: Authenticate with Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Fetch Model Artifacts from GCS
        run: |
          mkdir -p models/
          gsutil cp gs://${{ env.GCP_PROJECT_ID }}-models/*.joblib ./models/

      - name: Authorize Docker for Artifact Registry
        run: |
          gcloud auth configure-docker ${{ env.GCP_REGION }}-docker.pkg.dev --quiet

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.ARTIFACT_REGISTRY_REPO }}/${{ env.SERVICE_NAME }}:${{ github.sha }}
            ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.ARTIFACT_REGISTRY_REPO }}/${{ env.SERVICE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Remove Old Env Var Keys Before Deploying Secrets
        run: |
          gcloud run services update ${{ env.SERVICE_NAME }} \
            --region=${{ env.GCP_REGION }} \
            --remove-env-vars=API_KEY,PUBLIC_API_KEY || true

      - name: Deploy to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.SERVICE_NAME }}
          region: ${{ env.GCP_REGION }}
          image: ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.ARTIFACT_REGISTRY_REPO }}/${{ env.SERVICE_NAME }}:${{ github.sha }}
          flags: |
            --min-instances=1
            --allow-unauthenticated
          # --allow-unauthenticated is intentional: this is a public-facing
          # decision API by design (GTM/storefront callers). Access control
          # is enforced in-app via API_KEY/PUBLIC_API_KEY, not IAM — see
          # config/settings.py. If that assumption ever changes (e.g. this
          # becomes internal-only), switch to IAM auth + remove this flag
          # instead of layering more app-level checks on top.
          env_vars: |
            GCP_PROJECT_ID=${{ env.GCP_PROJECT_ID }}
            PUBSUB_TOPIC_ID=intent-telemetry-stream
            BQ_DATASET_ID=ml_logs
            BQ_TABLE_ID=causal_predictions_log
            ENVIRONMENT=production
            CORS_ORIGINS=https://yourstore.com
          secrets: |
            API_KEY=API_KEY:latest
            PUBLIC_API_KEY=PUBLIC_API_KEY:latest
